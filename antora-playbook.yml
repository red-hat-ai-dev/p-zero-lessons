    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/summit-2026/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

asciidoc:
  attributes:
    showroom-collection-version: v1.5.2

antora:
  extensions:
    - require: ./lib/inject-buttons.js

output:
  dir: ./www
