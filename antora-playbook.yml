    - url: .
      start_path: lessons/nemotron-lightning/content

    - url: .
      start_path: lessons/playground-create/content

    - url: .
      start_path: lessons/laguna-demo/content

    - url: .
      start_path: lessons/asago-supportdesk/content

ui:
